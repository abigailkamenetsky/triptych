<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/fonts.css">
<style>
  html,body{margin:0;padding:0;background:#000}
  svg{display:block}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="ground" cx="50%" cy="34%" r="82%">
      <stop offset="0%"   stop-color="#b8452a"/>
      <stop offset="46%"  stop-color="#8f2d1e"/>
      <stop offset="100%" stop-color="#39100a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#f6dc92"/>
      <stop offset="34%"  stop-color="#dfb247"/>
      <stop offset="68%"  stop-color="#bd8a1e"/>
      <stop offset="100%" stop-color="#8a610f"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e9c96f"/>
      <stop offset="100%" stop-color="#a2751a"/>
    </linearGradient>
    <filter id="tooth" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="atop"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#2a0a05" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>
  <rect width="1024" height="1024" fill="#fff" opacity="0.15" filter="url(#tooth)" style="mix-blend-mode:overlay"/>
  <rect width="1024" height="1024" fill="none" stroke="#2c0c06" stroke-width="26" opacity=".28"/>

  <!-- Thorn ring, held inside the maskable safe circle -->
  <g stroke="url(#goldSoft)" fill="none" stroke-linecap="round">
    <circle cx="512" cy="512" r="384" stroke-width="7" opacity=".5"/>
    <circle cx="512" cy="512" r="362" stroke-width="3.5" opacity=".34"/>
    <g stroke-width="7" opacity=".55">
      <path d="M512 128v-26M512 922v26M128 512h-26M922 512h26"/>
      <path d="M240 240l-19-19M784 240l19-19M240 784l-19 19M784 784l19 19"/>
    </g>
  </g>

  <!-- Berries, north and south -->
  <g fill="url(#goldSoft)" opacity=".85">
    <circle cx="512" cy="151" r="15"/>
    <circle cx="512" cy="873" r="15"/>
  </g>

  <!-- The letter -->
  <text x="512" y="512" text-anchor="middle" dominant-baseline="central"
        font-family="UnifrakturMaguntia" font-size="566"
        fill="url(#gold)" filter="url(#lift)">D</text>
</svg>
</body></html>
